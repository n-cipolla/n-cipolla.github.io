<!DOCTYPE html>
<html>
<head>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  overflow: hidden;
  width: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding: 16px;
}

h3 {
  margin-bottom: 8px;
  font-size: 1.1rem;
}

p {
  margin-bottom: 12px;
  font-size: 0.9rem;
}

label {
  display: block;
  font-size: 0.85rem;
  margin-bottom: 2px;
}

.slider {
  width: 100%;
  margin-bottom: 10px;
  display: block;
}

#plot {
  width: 100%;
}
</style>

</head>

<body>

<h3>Interactive Fourier Transform Visualization</h3>
<p>Move the sliders to change the component frequencies.</p>

<label>Frequency 1: <span id="f1val">2</span> Hz</label>
<input class="slider" type="range" id="f1" min="1" max="10" value="2">

<label>Frequency 2: <span id="f2val">5</span> Hz</label>
<input class="slider" type="range" id="f2" min="1" max="10" value="5">

<label>Frequency 3: <span id="f3val">8</span> Hz</label>
<input class="slider" type="range" id="f3" min="1" max="10" value="8">

<div id="plot"></div>

<script>

function createWave(A, f, t) {
  return t.map(x => A * Math.sin(2 * Math.PI * f * x))
}

function getPlotHeight() {
  return Math.min(320, window.innerWidth * 0.45)
}

function update() {
  let f1 = parseFloat(document.getElementById("f1").value)
  let f2 = parseFloat(document.getElementById("f2").value)
  let f3 = parseFloat(document.getElementById("f3").value)

  document.getElementById("f1val").textContent = f1
  document.getElementById("f2val").textContent = f2
  document.getElementById("f3val").textContent = f3

  let N = 4000
  let dt = 1 / 800

  let t = []
  for (let i = 0; i < N; i++) { t.push(i * dt) }

  let y1 = createWave(1, f1, t)
  let y2 = createWave(1, f2, t)
  let y3 = createWave(1, f3, t)

  let y = t.map((_, i) => y1[i] + y2[i] + y3[i])

  /* FFT */
  let freqs = []
  let spectrum = []

  for (let k = 0; k < 200; k++) {
    let re = 0
    let im = 0
    for (let n = 0; n < N; n++) {
      let angle = 2 * Math.PI * k * n / N
      re += y[n] * Math.cos(angle)
      im -= y[n] * Math.sin(angle)
    }
    re /= N
    im /= N
    freqs.push(k / (dt * N))
    spectrum.push(Math.sqrt(re * re + im * im))
  }

  let layout = {
    grid: { rows: 1, columns: 2, pattern: "independent" },
    height: getPlotHeight(),
    margin: { t: 30, b: 40, l: 45, r: 20 },
    xaxis:  { title: "Time (s)" },
    xaxis2: { title: "Frequency (Hz)", range: [0, 12] },
    yaxis:  { title: "Amplitude" },
    yaxis2: { title: "Power" },
    font: {
      family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
      size: 11
    },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor:  "rgba(0,0,0,0)"
  }

  let timeTrace = {
    x: t, y: y,
    mode: "lines", name: "signal",
    xaxis: "x", yaxis: "y",
    line: { width: 1.5 }
  }

  let freqTrace = {
    x: freqs, y: spectrum,
    mode: "lines", name: "spectrum",
    xaxis: "x2", yaxis: "y2",
    line: { width: 1.5 }
  }

  Plotly.react("plot", [timeTrace, freqTrace], layout, { responsive: true, displayModeBar: false })

  // Tell parent page our true height so it can resize the iframe
  requestAnimationFrame(() => {
    window.parent.postMessage({ iframeHeight: document.documentElement.scrollHeight }, "*")
  })
}

document.querySelectorAll("input").forEach(el => {
  el.addEventListener("input", update)
})

update()
</script>

</body>
</html>
